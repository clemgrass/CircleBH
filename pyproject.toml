[project]
name = "circlebh"
version = "0.2.0"
description = "Juego survivors en Python con pygame-ce: todo se dibuja con código y las armas son curvas matemáticas."
authors = [{ name = "clemgrass" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
circlebh = "circlebh.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# ADR 0002 y 0028: la misma versión de uv en todas las máquinas y en la CI.
required-version = "==0.13.9"
# ADR 0002 y 0011: una versión recién publicada no entra antes de 7 días.
exclude-newer = "7 days"
# ADR 0002: falla cualquier dependencia que no traiga wheel.
no-build = true

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
release = [
    "pyinstaller>=6.22.3",
]

# --- Tareas (ADR 0008) ---

[tool.poe.tasks.fast]
help = "Después de cada cambio: formato, lint y tests unitarios."
# Primero lint con --fix y después formato: un fix puede dejar líneas sin formatear.
sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
    { cmd = "pytest -m 'not simulacion' -q" },
]

[tool.poe.tasks.check]
help = "Antes del push y en la CI: lo de fast sin corregir, más tipos, capas, cobertura, auditoría e imágenes."
sequence = [
    { cmd = "ruff format --check" },
    { cmd = "ruff check" },
    { cmd = "mypy" },
    { cmd = "lint-imports" },
    { cmd = "pytest --cov --cov-report=term-missing:skip-covered", env = { HYPOTHESIS_PROFILE = "ci" } },
    # ADR 0011: si un aviso no aplica, se agrega `--ignore <ID>` con su motivo en un comentario.
    { cmd = "uv audit --locked --preview-features audit-command" },
    { cmd = "python tools/control_imagenes.py" },
]

[tool.poe.tasks.capturas]
help = "Evidencia en la sesión (ADR 0013): PNG sin ventana en .capturas/, con la semilla 1."
cmd = "circlebh --demo --scenario ${escenario} --seed 1 --capture ${tiempos}"
args = [
    { name = "escenario", options = ["--escenario"], default = "enemigo-persigue", help = "escenario de la demo" },
    { name = "tiempos", options = ["--tiempos"], default = "0,4,6", help = "segundos de cada captura, separados por coma" },
]

[tool.poe.tasks.balance-chequear]
help = "Compara balance.py y balance.json, y nombra cada campo que difiere (ADR 0004)."
cmd = "python -m circlebh.balance_tools chequear"

[tool.poe.tasks.balance-exportar]
help = "Escribe balance.json desde balance.py (Python → JSON)."
cmd = "python -m circlebh.balance_tools exportar"

[tool.poe.tasks.balance-importar]
help = "Reescribe el bloque de datos de balance.py desde balance.json (JSON → Python)."
cmd = "python -m circlebh.balance_tools importar"

[tool.poe.tasks.benchmark]
help = "Milisegundos por paso del enjambre de 300 hexágonos y del jefe de 100 líneas (ADR 0006). A mano, no en la CI."
cmd = "python tools/benchmark.py"

[tool.poe.tasks.musica]
help = "Evidencia de la música (ADR 0022): WAV de la demo en .capturas/ y ms por paso de la mezcla. A mano."
cmd = "python tools/musica.py"

[tool.poe.tasks.medios]
help = "Regenera las imágenes del README en docs/media/ (ADR 0013). Pendiente."
cmd = "python -c \"raise SystemExit('poe medios: pendiente, todavía no hay nada que mostrar')\""

# --- Lint y formato (ADR 0008) ---

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "N", "TID251"]

# ADR 0016: solo render/, scenes/ y el punto de entrada dibujan o tocan la pantalla.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pygame.draw".msg = "Solo render/ y scenes/ dibujan (ADR 0003 y 0016)."
"pygame.display".msg = "Solo render/ y scenes/ tocan la pantalla (ADR 0003 y 0016)."
"pygame.mixer".msg = "Solo scenes/music.py toca el mixer; audio/ entrega bytes (ADR 0022)."

[tool.ruff.lint.per-file-ignores]
"src/circlebh/render/**" = ["TID251"]
"src/circlebh/scenes/**" = ["TID251"]
"src/circlebh/__main__.py" = ["TID251"]

# --- Tipos (ADR 0008) ---

[tool.mypy]
strict = true
files = ["src"]

# --- Capas (ADR 0003) ---

[tool.importlinter]
root_package = "circlebh"

[[tool.importlinter.contracts]]
name = "Capas: scenes → render | audio → world → balance (ADR 0003 y 0022)"
type = "layers"
layers = [
    "circlebh.scenes",
    # Hermanas independientes: ninguna importa a la otra.
    "circlebh.render | circlebh.audio",
    "circlebh.world",
    "circlebh.balance",
]

# --- Tests (ADR 0007) ---

[tool.pytest]
# Un marker desconocido falla y un xfail que pasa rompe la suite.
strict = true
testpaths = ["tests"]
pythonpath = ["tools"]
markers = [
    "simulacion: la partida simulada completa; corre en poe check, no en poe fast (ADR 0007)",
]

[tool.coverage.run]
source = ["circlebh"]
branch = true
# ADR 0007: render/ y scenes/ no se testean.
omit = [
    "*/circlebh/render/*",
    "*/circlebh/scenes/*",
    "*/circlebh/__main__.py",
]
