[project]
name = "circlebh"
version = "0.0.0"
description = "Juego survivors en Python con pygame-ce: todo se dibuja con código y las armas son curvas matemáticas."
authors = [{ name = "clemgrass" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
circlebh = "circlebh.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# ADR 0002 y 0015: la misma versión de uv en todas las máquinas y en la CI.
required-version = "==0.13.7"
# ADR 0002 y 0011: una versión recién publicada no entra antes de 7 días.
exclude-newer = "7 days"
# ADR 0002: falla cualquier dependencia que no traiga wheel.
no-build = true

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
release = [
    "pyinstaller>=6.22.3",
]

# --- Tareas (ADR 0008) ---

[tool.poe.tasks.fast]
help = "Después de cada cambio: formato, lint y tests unitarios."
# Primero lint con --fix y después formato: un fix puede dejar líneas sin formatear.
sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
    { cmd = "pytest -m 'not simulacion' -q" },
]

[tool.poe.tasks.check]
help = "Antes del push y en la CI: lo de fast sin corregir, más tipos, capas, cobertura, auditoría e imágenes."
sequence = [
    { cmd = "ruff format --check" },
    { cmd = "ruff check" },
    { cmd = "mypy" },
    { cmd = "lint-imports" },
    { cmd = "pytest --cov --cov-report=term-missing:skip-covered", env = { HYPOTHESIS_PROFILE = "ci" } },
    # ADR 0011: si un aviso no aplica, se agrega `--ignore <ID>` con su motivo en un comentario.
    { cmd = "uv audit --locked --preview-features audit-command" },
    { cmd = "python tools/control_imagenes.py" },
]

[tool.poe.tasks.capturas]
help = "Evidencia en la sesión (ADR 0013): tres PNG sin ventana en .capturas/."
cmd = "circlebh --demo --scenario plano-vacio --seed 1 --capture 0,1,2"

[tool.poe.tasks.medios]
help = "Regenera las imágenes del README en docs/media/ (ADR 0013). Pendiente."
cmd = "python -c \"raise SystemExit('poe medios: pendiente, todavía no hay nada que mostrar')\""

# --- Lint y formato (ADR 0008) ---

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "N", "TID251"]

# ADR 0016: solo render/, scenes/ y el punto de entrada dibujan o tocan la pantalla.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pygame.draw".msg = "Solo render/ y scenes/ dibujan (ADR 0003 y 0016)."
"pygame.display".msg = "Solo render/ y scenes/ tocan la pantalla (ADR 0003 y 0016)."

[tool.ruff.lint.per-file-ignores]
"src/circlebh/render/**" = ["TID251"]
"src/circlebh/scenes/**" = ["TID251"]
"src/circlebh/__main__.py" = ["TID251"]

# --- Tipos (ADR 0008) ---

[tool.mypy]
strict = true
files = ["src"]

# --- Capas (ADR 0003) ---

[tool.importlinter]
root_package = "circlebh"

[[tool.importlinter.contracts]]
name = "Capas: scenes → render → world → balance (ADR 0003)"
type = "layers"
layers = [
    "circlebh.scenes",
    "circlebh.render",
    "circlebh.world",
    "circlebh.balance",
]

# --- Tests (ADR 0007) ---

[tool.pytest]
# Un marker desconocido falla y un xfail que pasa rompe la suite.
strict = true
testpaths = ["tests"]
pythonpath = ["tools"]
markers = [
    "simulacion: la partida simulada completa; corre en poe check, no en poe fast (ADR 0007)",
]

[tool.coverage.run]
source = ["circlebh"]
branch = true
# ADR 0007: render/ y scenes/ no se testean.
omit = [
    "*/circlebh/render/*",
    "*/circlebh/scenes/*",
    "*/circlebh/__main__.py",
]
