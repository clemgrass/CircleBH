# CI (ADR 0008 y 0011): corre `uv run poe check`, lo mismo que en local.
# El ruleset de main exige que el job `check` pase (ADR 0010).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: el token solo puede leer el repo.
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `version`: lee `required-version` de pyproject.toml (ADR 0002 y 0015).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Falla si uv.lock no calza con pyproject.toml. uv descarga el Python de .python-version.
      - run: uv sync --locked

      - run: uv run --locked poe check
