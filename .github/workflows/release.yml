# Release (ADR 0009): ejecutables con PyInstaller, en modo carpeta, para Windows x64,
# macOS ARM y Linux x64. Cada uno se prueba abriéndolo en modo demo sin ventana.
#
# - Tag `vX.Y.Z` en main: arma, prueba y publica el Release con notas automáticas.
# - `workflow_dispatch`: arma y prueba, sin publicar. Los zips quedan como artefactos.
# - PR que cambia este archivo: lo mismo, para probar el workflow antes del merge.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

# Mínimo privilegio: solo el job `release` puede escribir.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            exe: circlebh.exe
          - target: macos-arm64
            os: macos-15
            exe: circlebh
          - target: linux-x64
            os: ubuntu-24.04
            exe: circlebh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `version`: lee `required-version` de pyproject.toml (ADR 0002 y 0015).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --locked --group release

      # `--collect-data circlebh` mete los datos del paquete (balance.json y
      # settings.json): sin ellos, el juego no arranca (ADR 0004 y 0018).
      - name: Armar con PyInstaller
        run: >
          uv run --locked --group release pyinstaller
          --noconfirm --clean --onedir --name circlebh --specpath build
          --collect-data circlebh
          src/circlebh/__main__.py

      # El smoke corre el ejecutable empaquetado, no el código: si arranca, dibuja
      # y guarda el PNG sin pantalla, el zip sirve en este sistema.
      - name: Smoke sin ventana
        env:
          EXE: ${{ matrix.exe }}
        run: |
          mkdir smoke && cd smoke
          "../dist/circlebh/$EXE" --demo --seed 1 --capture 0
          test -f .capturas/plano-vacio-seed1-t0.00.png

      # `zip -r -y` conserva el permiso de ejecución y los enlaces; `python -m zipfile` no.
      - name: Comprimir
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../circlebh-$TARGET.zip" circlebh
          else
            zip -q -r -y "../circlebh-$TARGET.zip" circlebh
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: circlebh-${{ matrix.target }}
          path: circlebh-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # La versión vive solo en pyproject.toml (ADR 0009): el tag tiene que coincidir.
      - name: El tag coincide con la versión
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: zips
          merge-multiple: true

      # Immutable releases: los zips se adjuntan al borrador y recién después se publica.
      - name: Publicar el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" zips/*.zip \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
